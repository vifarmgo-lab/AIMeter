services:
  wallet-viewer:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      aimeter:
        condition: service_healthy
    ports:
      - "127.0.0.1:3187:8080"
    environment:
      VIEWER_ORIGIN: ${VIEWER_ORIGIN:?set the external HTTPS origin}
      VIEWER_FRAME_ANCESTORS: ${VIEWER_FRAME_ANCESTORS:?set the trusted Lark frame origins}
      NGINX_ENVSUBST_FILTER: "^(VIEWER_ORIGIN|VIEWER_FRAME_ANCESTORS)$$"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./viewer.conf.template:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      options: { max-size: "5m", max-file: "2" }
